<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hodos — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;

      background:
        radial-gradient(ellipse 55% 48% at 0%   0%,  rgba(240,122, 90,.28) 0%, rgba(240,122, 90,0) 70%),
        radial-gradient(ellipse 52% 45% at 100%  0%,  rgba(184,169,240,.24) 0%, rgba(184,169,240,0) 70%),
        radial-gradient(ellipse 60% 50% at 0%  100%,  rgba(125,232,192,.22) 0%, rgba(125,232,192,0) 70%),
        radial-gradient(ellipse 48% 42% at 75% 100%,  rgba(125,232,192,.14) 0%, rgba(125,232,192,0) 65%),
        #ffffff;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 52px;
    }

    .logo-img {
      height: 80px;
      width: auto;
    }

    .btn-connect {
      font-family: 'Montserrat', sans-serif;
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 18px 64px;
      border-radius: 50px;
      background: #1B2A6B;
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 28px rgba(27,42,107,.28);
      transition: transform .25s, box-shadow .25s;
    }
    .btn-connect:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(27,42,107,.38);
    }
  </style>
</head>
<body>
  <div class="splash-content">
    <img class="logo-img" src="logo.png" alt="Hodos">
    <button class="btn-connect" onclick="window.location.href='onboarding.html'">
      SE CONNECTER
    </button>
  </div>
</body>
</html>
