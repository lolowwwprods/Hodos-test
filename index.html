<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hodos — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif;
    }

    /* ── Rectangles dégradés dans les coins ──────────────── */
    .grad {
      position: fixed;
      pointer-events: none;
      z-index: 0;
    }

    /* Salmon — coin haut-gauche */
    .grad-tl {
      top: 0; left: 0;
      width: 42%; height: 52%;
      background: linear-gradient(135deg,
        rgba(240, 122, 90, .30) 0%,
        transparent                70%);
    }

    /* Lilas — coin haut-droite */
    .grad-tr {
      top: 0; right: 0;
      width: 40%; height: 48%;
      background: linear-gradient(225deg,
        rgba(184, 169, 240, .26) 0%,
        transparent                70%);
    }

    /* Mint — coin bas-gauche */
    .grad-bl {
      bottom: 0; left: 0;
      width: 44%; height: 50%;
      background: linear-gradient(315deg,
        rgba(125, 232, 192, .24) 0%,
        transparent                70%);
    }

    /* ── Contenu centré ──────────────────────────────────── */
    .splash-content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; gap: 52px;
    }

    .logo-img {
      height: 80px;
      width: auto;
    }

    /* ── Bouton ──────────────────────────────────────────── */
    .btn-connect {
      font-family: 'Montserrat', sans-serif;
      font-size: .88rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 18px 64px; border-radius: 50px;
      background: #1B2A6B; color: #fff;
      border: none; cursor: pointer;
      box-shadow: 0 6px 28px rgba(27, 42, 107, .28);
      transition: transform .25s, box-shadow .25s;
    }
    .btn-connect:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(27, 42, 107, .38);
    }
  </style>
</head>
<body>

  <!-- Rectangles dégradés (pas de border-radius) -->
  <div class="grad grad-tl"></div>
  <div class="grad grad-tr"></div>
  <div class="grad grad-bl"></div>

  <!-- Contenu -->
  <div class="splash-content">
    <img class="logo-img" src="logo.png" alt="Hodos">
    <button class="btn-connect" onclick="window.location.href='onboarding.html'">
      SE CONNECTER
    </button>
  </div>

</body>
</html>
