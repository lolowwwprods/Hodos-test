<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hodos — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base ──────────────────────────────────────────────── */
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }
    body {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }

    /* ═══════════════════════════════════════════════════════
       LIGHT MODE BACKGROUND
       Multi-radial-gradient: salmon TL, lavender TR, mint BL
    ═══════════════════════════════════════════════════════ */
    [data-theme="light"] body {
      background:
        radial-gradient(ellipse 65% 55% at -2% -2%,  rgba(240, 122,  90, .38) 0%, transparent 60%),
        radial-gradient(ellipse 60% 52% at 102%  -2%, rgba(184, 169, 240, .32) 0%, transparent 60%),
        radial-gradient(ellipse 55% 48% at  -2% 102%, rgba(125, 232, 192, .26) 0%, transparent 60%),
        radial-gradient(ellipse 50% 44% at 102% 102%, rgba(125, 232, 192, .18) 0%, transparent 55%),
        #FAFAFF;
    }

    /* ═══════════════════════════════════════════════════════
       DARK MODE BACKGROUND + SHAPES
    ═══════════════════════════════════════════════════════ */
    [data-theme="dark"] body { background: #1B2A6B; }

    /* Each shape is a full-screen absolute div with clip-path */
    .dark-shape {
      display: none;
      position: absolute; inset: 0;
      pointer-events: none;
    }
    [data-theme="dark"] .dark-shape { display: block; }

    /* Shape 1 — Teal diagonal band (left) */
    .ds1 {
      background: linear-gradient(152deg, #42C8C8 0%, #2AACAC 100%);
      clip-path: polygon(0 0, 66% 0, 41% 100%, 0 100%);
      opacity: .84;
    }

    /* Shape 2 — Brownish-mauve triangle (top-right) */
    .ds2 {
      background: #8B6070;
      clip-path: polygon(63% 0, 100% 0, 100% 40%);
      opacity: .82;
    }

    /* Shape 3 — Lavender-blue quadrilateral (bottom-right) */
    .ds3 {
      background: linear-gradient(165deg, #5A5FA4 0%, #484D90 100%);
      clip-path: polygon(57% 54%, 100% 42%, 100% 100%, 40% 100%);
      opacity: .78;
    }

    /* ── Content ───────────────────────────────────────────── */
    .splash-content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; gap: 52px;
    }

    /* ── Logo ──────────────────────────────────────────────── */
    .logo-wrap {
      display: flex; align-items: center; gap: 18px;
      user-select: none;
    }
    .logo-icon {
      width: 80px; height: 80px; flex-shrink: 0;
    }
    .logo-text {
      font-size: 3.8rem; font-weight: 800; letter-spacing: -1px; line-height: 1;
    }
    [data-theme="light"] .logo-icon path,
    [data-theme="light"] .logo-icon circle { stroke: #1B2A6B; }
    [data-theme="light"] .logo-text { color: #1B2A6B; }

    [data-theme="dark"] .logo-icon path,
    [data-theme="dark"] .logo-icon circle { stroke: #FFFFFF; }
    [data-theme="dark"] .logo-text { color: #FFFFFF; }

    /* ── SE CONNECTER button ──────────────────────────────── */
    .btn-connect {
      font-family: 'Montserrat', sans-serif;
      font-size: .88rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 18px 64px; border-radius: 50px;
      cursor: pointer; transition: all .28s;
      border: 2.5px solid transparent;
    }
    [data-theme="light"] .btn-connect {
      background: #1B2A6B; color: #fff;
      border-color: #1B2A6B;
      box-shadow: 0 6px 28px rgba(27,42,107,.30);
    }
    [data-theme="light"] .btn-connect:hover {
      background: #0D1842; transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(27,42,107,.40);
    }
    [data-theme="dark"] .btn-connect {
      background: transparent; color: #fff;
      border-color: #fff;
    }
    [data-theme="dark"] .btn-connect:hover {
      background: rgba(255,255,255,.14);
      transform: translateY(-3px);
    }

    /* ── Theme toggle ─────────────────────────────────────── */
    .theme-toggle {
      position: fixed; top: 22px; right: 24px; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      padding: 9px 20px; border-radius: 50px;
      font-family: 'Montserrat', sans-serif;
      font-size: .78rem; font-weight: 700;
      cursor: pointer; transition: all .25s;
      backdrop-filter: blur(12px);
    }
    [data-theme="light"] .theme-toggle {
      background: rgba(27,42,107,.07);
      border: 2px solid rgba(27,42,107,.16);
      color: #1B2A6B;
    }
    [data-theme="dark"] .theme-toggle {
      background: rgba(255,255,255,.12);
      border: 2px solid rgba(255,255,255,.22);
      color: #fff;
    }
    .theme-toggle:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <!-- Dark mode geometric shapes -->
  <div class="dark-shape ds1"></div>
  <div class="dark-shape ds2"></div>
  <div class="dark-shape ds3"></div>

  <!-- Theme toggle -->
  <button class="theme-toggle" onclick="toggleTheme()" id="toggle-btn">
    <span id="toggle-icon">🌙</span>
    <span id="toggle-label">Mode sombre</span>
  </button>

  <!-- Main splash content -->
  <div class="splash-content">

    <!-- Logo with faithful SVG icon -->
    <div class="logo-wrap">
      <!--
        Icon = 3 elements:
          1. Small hollow ring  (top-left "°" element)
          2. Large outer C-arc  (opening top-right, ~280° sweep)
          3. Inner S-curve      (flowing inside the C)
        Traced from the official Hodos PNG.
      -->
      <svg class="logo-icon" viewBox="0 0 88 88" fill="none"
           xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Small hollow ring — top-left, in the gap of the outer arc -->
        <circle cx="23" cy="12" r="8.5"
                stroke="#1B2A6B" stroke-width="5.5" fill="none"/>

        <!-- Outer C-arc — centre (44,52), r=34
             From (62, 21) CW through bottom to (26, 21), sweep≈280° -->
        <path d="M 62 21 A 34 34 0 1 1 26 21"
              stroke="#1B2A6B" stroke-width="7"
              stroke-linecap="round" fill="none"/>

        <!-- Inner S-curve — flows through the C from upper to lower region -->
        <path d="M 38 25 C 64 18 72 46 43 55 C 14 64 20 84 53 80"
              stroke="#1B2A6B" stroke-width="6"
              stroke-linecap="round" fill="none"/>
      </svg>

      <span class="logo-text">Hodos</span>
    </div>

    <!-- CTA button -->
    <button class="btn-connect" onclick="goConnect()">SE CONNECTER</button>

  </div>

  <script>
    // ── Init theme from localStorage ──────────────────────────
    (function() {
      const t = localStorage.getItem('hodos-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      refreshToggle(t);
    })();

    function toggleTheme() {
      const cur  = document.documentElement.getAttribute('data-theme');
      const next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('hodos-theme', next);
      refreshToggle(next);
    }

    function refreshToggle(t) {
      const icon  = document.getElementById('toggle-icon');
      const label = document.getElementById('toggle-label');
      if (icon)  icon.textContent  = t === 'light' ? '🌙' : '☀️';
      if (label) label.textContent = t === 'light' ? 'Mode sombre' : 'Mode clair';
    }

    function goConnect() {
      const visited = localStorage.getItem('hodos-visited');
      localStorage.setItem('hodos-visited', '1');
      window.location.href = visited ? 'dashboard.html' : 'onboarding.html';
    }
  </script>
</body>
</html>
