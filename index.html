<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hodos — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Montserrat', sans-serif;
    }

    /* ── Blobs décoratifs ─────────────────────────────────── */
    .blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(72px);
      opacity: 0.28;
    }

    /* Salmon — haut gauche */
    .blob-salmon {
      width: 520px; height: 520px;
      background: #F07A5A;
      top: -180px; left: -160px;
    }

    /* Lilas — haut droite */
    .blob-lilas {
      width: 460px; height: 460px;
      background: #B8A9F0;
      top: -150px; right: -140px;
    }

    /* Mint — bas gauche */
    .blob-mint {
      width: 480px; height: 480px;
      background: #7DE8C0;
      bottom: -180px; left: -140px;
    }

    /* ── Contenu centré ───────────────────────────────────── */
    .splash-content {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; gap: 52px;
    }

    .logo-img {
      height: 90px;
      width: auto;
    }

    /* ── Bouton ───────────────────────────────────────────── */
    .btn-connect {
      font-family: 'Montserrat', sans-serif;
      font-size: .88rem; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 18px 64px; border-radius: 50px;
      background: #1B2A6B; color: #fff;
      border: none; cursor: pointer;
      box-shadow: 0 6px 28px rgba(27, 42, 107, .30);
      transition: transform .25s, box-shadow .25s;
    }
    .btn-connect:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(27, 42, 107, .40);
    }
  </style>
</head>
<body>

  <!-- Blobs décoratifs -->
  <div class="blob blob-salmon"></div>
  <div class="blob blob-lilas"></div>
  <div class="blob blob-mint"></div>

  <!-- Contenu -->
  <div class="splash-content">
    <img class="logo-img" src="logo.png" alt="Hodos">
    <button class="btn-connect" onclick="window.location.href='onboarding.html'">
      SE CONNECTER
    </button>
  </div>

</body>
</html>
